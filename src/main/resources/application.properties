# ---- 服务端口（对外查询接口） ----
server.port=8080

# ---- 采集网关运行参数 ----
gateway.poll-interval-ms=1000
gateway.stale-threshold-ms=5000
gateway.reconnect-backoff-initial-ms=500
gateway.reconnect-backoff-max-ms=10000

# ---- 本地可复现 TCP 数据源（内置 Mock Modbus TCP 服务） ----
gateway.mock-server-enabled=true
gateway.mock-server-port=11502

# ---- 设备：指向本机 Mock 数据源 ----
# device-1：覆盖不同字节序/字序、符号、缩放与量程的数据点
gateway.devices[0].id=device-1
gateway.devices[0].host=127.0.0.1
gateway.devices[0].port=11502
gateway.devices[0].unit-id=1
gateway.devices[0].connect-timeout-ms=1000
gateway.devices[0].response-timeout-ms=1500

gateway.devices[0].points[0].id=temp_big_endian
gateway.devices[0].points[0].address=0
gateway.devices[0].points[0].type=INT16
gateway.devices[0].points[0].order=ABCD
gateway.devices[0].points[0].scale=0.1
gateway.devices[0].points[0].offset=-40
gateway.devices[0].points[0].min=-50
gateway.devices[0].points[0].max=150

gateway.devices[0].points[1].id=pressure_word_swap
gateway.devices[0].points[1].address=2
gateway.devices[0].points[1].type=UINT32
gateway.devices[0].points[1].order=CDAB
gateway.devices[0].points[1].scale=1
gateway.devices[0].points[1].offset=0

gateway.devices[0].points[2].id=flow_float_little
gateway.devices[0].points[2].address=4
gateway.devices[0].points[2].type=FLOAT32
gateway.devices[0].points[2].order=DCBA
gateway.devices[0].points[2].scale=1
gateway.devices[0].points[2].offset=0

gateway.devices[0].points[3].id=energy_int64
gateway.devices[0].points[3].address=8
gateway.devices[0].points[3].type=INT64
gateway.devices[0].points[3].order=ABCD
gateway.devices[0].points[3].scale=0.001
gateway.devices[0].points[3].offset=0
